[package]
name = "RepairCalc"
version = "0.1.0"
edition = "2024"
default-run = "RepairCalc"

[lib]
name = "repair_calc"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tempfile = "3"
